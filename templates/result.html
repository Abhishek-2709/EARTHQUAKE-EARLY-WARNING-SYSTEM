<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prediction Result</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f9f9f9;
            color: #333;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #4CAF50;
            font-size: 2em;
            margin-bottom: 20px;
        }

        .result-container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .result-container p {
            font-size: 1.2em;
            color: #555;
            margin: 20px 0;
        }

        .result-label {
            font-weight: bold;
            color: #333;
        }

        .event {
            font-size: 1.5em;
            color: #FF5733; /* Orange color for event label */
            font-weight: bold;
            text-transform: capitalize;
        }

        .back-button {
            display: inline-block;
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            font-size: 1em;
            text-decoration: none;
            border-radius: 5px;
            margin-top: 20px;
            text-align: center;
        }

        .back-button:hover {
            background-color: #45a049;
        }

        .footer {
            text-align: center;
            font-size: 0.9em;
            color: #888;
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <h1>Prediction Result</h1>

    <div class="result-container">
        <p class="result-label">Predicted Event:</p>
        <p class="event">{{ event_label }}</p>
       
    </div>

    <div class="footer">
        <p>&copy;  Earthquake Prediction System </p>
    </div>

</body>
</html>
